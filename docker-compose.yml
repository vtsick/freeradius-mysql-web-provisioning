x-app: &app
  build:
    context: .
    args:
      BASE_IMAGE: ${BASE_IMAGE:-python:3.11-slim}
  image: freeradius-provisioning:local
  pull_policy: never
  network_mode: host
  env_file: .env
  volumes:
    - ./cluster.json:/app/cluster.json:ro
    - ./nginx/app.conf:/etc/nginx/templates/app.conf.template:ro
    - ./user_credentials.db:/app/user_credentials.db
    - /dev/log:/dev/log
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      CLUSTER_CONFIG: /app/cluster.json
      PROVISIONING_NODE: fr-1
  app-fr-2:
    <<: *app
    environment:
      CLUSTER_CONFIG: /app/cluster.json
      PROVISIONING_NODE: fr-2
  app-fr-3:
    <<: *app
    environment:
      CLUSTER_CONFIG: /app/cluster.json
      PROVISIONING_NODE: fr-3
  app-fr-4:
    <<: *app
    environment:
      CLUSTER_CONFIG: /app/cluster.json
      PROVISIONING_NODE: fr-4
